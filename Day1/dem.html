<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:380px;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#2c3e50;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#3498db;
}

button{
    width:100%;
    margin-top:20px;
    padding:12px;
    border:none;
    background:#3498db;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}
</style>
<div class="container">

    <h1>Sign Up</h1>

    <form>

        <label>Full Name</label>
        <input type="text" placeholder="Enter Full Name">

        <label>Email Address</label>
        <input type="email" placeholder="Enter Email">

        <label>Password</label>
        <input type="password" placeholder="Enter Password">

        <label>Confirm Password</label>
        <input type="password" placeholder="Confirm Password">

        <button type="submit">Sign Up</button>

    </form>

</div>

</body>
</html>
